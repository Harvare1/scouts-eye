{% extends 'base.html' %}{% block title %}Nytt matchuppdrag{% endblock %}{% block content %}
<div class="eyebrow">Club portal / Assignments</div><h1 class="title">NYTT UPPDRAG.</h1><p class="subtitle">Skapa ett konkret scoutinguppdrag. Ge endast videolänkar som scouten har rätt att använda.</p>
<form class="card" method="post" action="/assignments/new" style="max-width:850px"><input type="hidden" name="csrf" value="{{csrf}}"><div class="form-row"><label class="field"><span>Klubb</span><select name="club_id">{% for c in clubs %}<option value="{{c['id']}}">{{c['name']}}</option>{% endfor %}</select></label><label class="field"><span>Scout (valfritt)</span><select name="scout_id"><option value="">Låt scouter ansöka</option>{% for s in scouts %}<option value="{{s['id']}}">{{s['name']}} ({{s['email']}})</option>{% endfor %}</select></label></div><label class="field"><span>Uppdragets titel</span><input name="title" required placeholder="Exempel: Motståndaranalys mot IF Exempel"></label><label class="field"><span>Match / lag</span><input name="fixture" required placeholder="Lag A – Lag B"></label><div class="form-row"><label class="field"><span>Matchdatum</span><input type="date" name="match_date"></label><label class="field"><span>Deadline</span><input type="date" name="deadline"></label></div><label class="field"><span>Behörighetsstyrd videolänk (valfritt)</span><input type="url" name="video_url" placeholder="https://..." inputmode="url"><small>Veo, Hudl, annan leverantör. Vi sparar länken – inte videofilen. Kolla extern åtkomst separat.</small></label><label class="field"><span>Instruktioner till scout</span><textarea name="instructions" placeholder="Vad ska observeras? Vilka frågor ska rapporten besvara?"></textarea></label><button class="btn" type="submit">Skapa uppdrag →</button></form>
{% endblock %}
