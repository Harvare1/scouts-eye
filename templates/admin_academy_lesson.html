{% extends 'base.html' %}{% block title %}Redigera Academy-lektion{% endblock %}{% block content %}
<div class="eyebrow"><a href="/admin/academy">Academy-admin</a> / {{lesson['course_title']}} / {{lesson['module_title']}}</div><h1 class="title">REDIGERA LEKTION.</h1><form class="card" method="post" action="/admin/academy/lessons/{{lesson['id']}}"><input type="hidden" name="csrf" value="{{csrf}}"><label class="field"><span>Titel</span><input name="title" value="{{lesson['title']}}" required></label><label class="field"><span>Lärandemål</span><textarea name="learning_objective">{{lesson['learning_objective']}}</textarea></label><label class="field"><span>Undervisningsmaterial</span><textarea name="body" rows="18">{{lesson['body']}}</textarea></label><label class="field"><span>Fotbollsexempel</span><textarea name="example" rows="8">{{lesson['example']}}</textarea></label><label class="field"><span>Praktisk övning</span><textarea name="exercise" rows="8">{{lesson['exercise']}}</textarea></label><label class="field"><span>Licensierad videolänk (valfri)</span><input type="url" name="video_url" value="{{lesson['video_url']}}" placeholder="https://..."><small>Använd bara material Andrablicken har rätt att visa. Videon bäddas inte in utan öppnas hos rättighetsinnehavaren.</small></label><div class="form-row"><label class="field"><span>Illustrationstyp</span><input name="diagram_kind" value="{{lesson['diagram_kind']}}"></label><label class="field"><span>Status</span><select name="status"><option value="draft" {% if lesson['status']=='draft' %}selected{% endif %}>Utkast</option><option value="published" {% if lesson['status']=='published' %}selected{% endif %}>Publicerad</option></select></label></div><hr class="line"><h2 class="h2">Kunskapsfråga med förklaring</h2><label class="field"><span>Fråga</span><input name="question_text" value="{{question['question'] if question else ''}}"></label><div class="form-row"><label class="field"><span>Svar 1</span><input name="choice_1" value="{{question['choices'][0] if question and question['choices']|length>0 else ''}}"></label><label class="field"><span>Svar 2</span><input name="choice_2" value="{{question['choices'][1] if question and question['choices']|length>1 else ''}}"></label><label class="field"><span>Svar 3</span><input name="choice_3" value="{{question['choices'][2] if question and question['choices']|length>2 else ''}}"></label><label class="field"><span>Rätt svar (0, 1 eller 2)</span><input type="number" name="correct_index" min="0" max="2" value="{{question['correct_index'] if question else 0}}"></label></div><label class="field"><span>Förklaring efter svar</span><textarea name="explanation">{{question['explanation'] if question else ''}}</textarea></label><div class="buttons"><button class="btn">Spara lektion</button><a class="btn outline" href="/courses/lessons/{{lesson['id']}}">Förhandsvisa →</a></div></form>
{% endblock %}
