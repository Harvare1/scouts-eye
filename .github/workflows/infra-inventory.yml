name: Infra inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: appserver1
            host: 82.197.73.183
            password_secret: APPSERVER1_SSH_PASSWORD
          - label: appserver2
            host: 207.2.123.192
            password_secret: APPSERVER2_SSH_PASSWORD
          - label: db-prod
            host: 207.2.123.155
            password_secret: DB_PROD_SSH_PASSWORD
          - label: proxy-lb
            host: 103.177.249.207
            password_secret: PROXY_LB_SSH_PASSWORD
          - label: testapp
            host: 103.177.249.171
            password_secret: TESTAPP_SSH_PASSWORD

    env:
      SSHPASS: ${{ secrets[matrix.password_secret] }}

    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Verify required secret
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "Missing repository secret: ${{ matrix.password_secret }}" >&2
            exit 1
          fi

      - name: Collect read-only inventory
        run: |
          sshpass -e ssh \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=10 \
            root@${{ matrix.host }} 'bash -s' > inventory-${{ matrix.label }}.txt <<'REMOTE'
          set -u

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          section system
          hostnamectl 2>/dev/null || hostname
          uname -a
          uptime

          section storage
          df -hT

          section listening-ports
          ss -lntup 2>/dev/null || true

          section docker-version
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' 2>/dev/null || true
          docker compose version 2>/dev/null || true

          section docker-containers
          docker ps --no-trunc --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true

          section compose-projects
          docker compose ls --all 2>/dev/null || true

          section docker-networks
          docker network ls 2>/dev/null || true

          section docker-volumes
          docker volume ls 2>/dev/null || true

          section compose-files
          find /etc /opt /srv /root /home -maxdepth 5 -type f \
            \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) \
            -print 2>/dev/null | sort

          section running-services
          systemctl list-units --type=service --state=running --no-pager --no-legend 2>/dev/null || true
          REMOTE

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: infra-inventory-${{ matrix.label }}
          path: inventory-${{ matrix.label }}.txt
          if-no-files-found: error
          retention-days: 7
