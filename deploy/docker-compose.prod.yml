services:
  andrablicken:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8091:8000"
    env_file:
      - ${ANDRABLICKEN_RUNTIME_ENV:-/opt/andrablicken/runtime.env}
    volumes:
      - /opt/andrablicken/data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3);
          assert response.status == 200 and json.load(response) == {'status': 'ok', 'mode': 'production'}
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    labels:
      autoheal: "true"

